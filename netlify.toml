[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Security headers for static files. Server-rendered pages get the same headers (plus the
# strict payment-page CSP on /checkout/*) from src/middleware.ts.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  NODE_VERSION = "18"

# Disable secrets scanning - we have PUBLIC_* vars that are intentionally client-side
[build.processing.secrets]
  enabled = false

# QR code tracking redirect - use /qr?url=... for cleaner QR codes
[[redirects]]
  from = "/qr"
  to = "/.netlify/functions/qr-track"
  status = 200
  force = true
